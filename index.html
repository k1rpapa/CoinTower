<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Tower - 桁上がりマスター</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* --- レベル選択画面 --- */
        #level-select-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(240, 244, 248, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .level-title {
            font-size: 36px;
            font-weight: bold;
            color: #333;
            margin-bottom: 40px;
        }
        .level-btn {
            width: 280px;
            padding: 20px;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 15px;
            box-shadow: 0 6px 0 #0056b3;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .level-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #0056b3;
        }
        .level-btn.lvl2 {
            background-color: #28a745;
            box-shadow: 0 6px 0 #1e7e34;
        }
        .level-btn.lvl2:active {
            box-shadow: 0 0 0 #1e7e34;
        }

        /* --- ゲーム画面 --- */
        #equation {
            font-size: clamp(32px, 8vw, 48px);
            font-weight: bold;
            color: #333;
            margin: 10px 0 20px 0;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            padding: 10px 30px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .cursor {
            border-bottom: 4px solid #007bff;
            width: 30px;
            display: inline-block;
            margin-left: 5px;
            animation: blink 1s infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* 10の部屋と1の部屋の間隔を調整 */
        #game-area {
            display: flex;
            justify-content: center;
            gap: 75px; /* ホバリングエリアが入るため間隔を広めに */
            margin-bottom: 30px;
            visibility: hidden; /* レベル選択までは隠す */
        }

        .tube-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .tube-label {
            font-size: 18px;
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
        }

        .tube-wrapper {
            position: relative; 
        }

        .tube {
            width: 60px;
            height: 440px; 
            background-color: rgba(255, 255, 255, 0.6);
            background-image: repeating-linear-gradient(
                to top,
                transparent,
                transparent 43px,
                rgba(0, 0, 0, 0.15) 43px,
                rgba(0, 0, 0, 0.15) 44px
            );
            border: 4px solid #b0bec5;
            border-top: none;
            border-radius: 0 0 15px 15px;
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            box-shadow: inset 0 -5px 10px rgba(0,0,0,0.05);
            position: relative;
        }

        .tube::after {
            content: '';
            position: absolute;
            bottom: 219px; 
            left: 0;
            width: 100%;
            height: 2px;
            background-color: rgba(0, 0, 0, 0.2); 
            z-index: 1;
        }

        /* 共通のホバリングスタイル。各チューブの右側に配置される */
        .hover-area {
            position: absolute;
            top: 0; 
            left: 80px; 
            width: 60px;
            height: 440px; 
            display: flex;
            flex-direction: column; 
            align-items: center;
            z-index: 10;
        }

        .coin {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 20px;
            margin: 2px 0; 
            box-shadow: 0 3px 5px rgba(0,0,0,0.2);
            z-index: 5;
            box-sizing: border-box;
            transition: opacity 0.3s ease;
        }

        .coin-1 {
            background: radial-gradient(circle at 30% 30%, #ffffff, #e0e0e0);
            border: 2px solid #9e9e9e;
            color: #424242;
        }

        .coin-10 {
            background: radial-gradient(circle at 30% 30%, #ffcc80, #d84315);
            border: 2px solid #8d6e63;
            color: #fff;
        }

        #numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 320px;
            visibility: hidden;
        }

        .num-btn {
            height: 65px;
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 0 #0056b3;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .num-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #0056b3;
        }

        /* --- アニメーション --- */
        @keyframes jumpIn {
            0% { transform: translate(60px, -40px) scale(1.1); opacity: 0.5; }
            100% { transform: translate(0, 0) scale(1); opacity: 1; }
        }

        @keyframes dropTen {
            0% { transform: translateY(-150px); opacity: 0; }
            80% { transform: translateY(10px); opacity: 1; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .glow-merge {
            animation: mergeAnim 0.7s forwards;
        }
        @keyframes mergeAnim {
            0% { box-shadow: 0 0 10px #ffeb3b; }
            40% { box-shadow: 0 0 30px #ffeb3b; transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }

        .shake {
            animation: mildShake 0.4s ease-in-out;
            background-color: #dc3545 !important;
            box-shadow: 0 4px 0 #a71d2a !important;
        }
        @keyframes mildShake {
            0%, 100% { transform: translateX(0); }
            25%, 75% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
        }

        #success-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            background: radial-gradient(circle, rgba(255,215,0,0.3) 0%, rgba(255,255,255,0) 70%);
            opacity: 0;
            z-index: 100;
            transition: opacity 0.3s;
        }
        
        /* レベル選択に戻るボタン */
        #back-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 8px 15px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            background-color: #6c757d;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            visibility: hidden;
            z-index: 50;
        }
    </style>
</head>
<body>

    <div id="level-select-overlay">
        <div class="level-title">Coin Tower</div>
        <button class="level-btn" onclick="startGame(1)">レベル 1<br><span style="font-size:16px;">(1桁 ＋ 1桁)</span></button>
        <button class="level-btn lvl2" onclick="startGame(2)">レベル 2<br><span style="font-size:16px;">(2桁 ＋ 2桁)</span></button>
    </div>

    <button id="back-btn" onclick="showLevelSelect()">◀ もどる</button>

    <div id="success-overlay"></div>

    <div id="equation">
        <span id="eq-x"></span> + <span id="eq-y"></span> = <span id="eq-ans"></span><span class="cursor" id="cursor"></span>
    </div>

    <div id="game-area">
        <div class="tube-container">
            <div class="tube-label">10の部屋</div>
            <div class="tube-wrapper">
                <div id="tens-tube" class="tube"></div>
                <div id="tens-hover-area" class="hover-area"></div>
            </div>
        </div>
        <div class="tube-container">
            <div class="tube-label">1の部屋</div>
            <div class="tube-wrapper">
                <div id="ones-tube" class="tube"></div>
                <div id="ones-hover-area" class="hover-area"></div>
            </div>
        </div>
    </div>

    <div id="numpad"></div>

    <script>
        const levelSelect = document.getElementById('level-select-overlay');
        const gameArea = document.getElementById('game-area');
        const numpad = document.getElementById('numpad');
        const backBtn = document.getElementById('back-btn');
        
        const eqX = document.getElementById('eq-x');
        const eqY = document.getElementById('eq-y');
        const eqAns = document.getElementById('eq-ans');
        const cursor = document.getElementById('cursor');
        
        const onesTube = document.getElementById('ones-tube');
        const tensTube = document.getElementById('tens-tube');
        const onesHoverArea = document.getElementById('ones-hover-area');
        const tensHoverArea = document.getElementById('tens-hover-area');
        const overlay = document.getElementById('success-overlay');

        let currentLevel = 1;
        let valX = 0;
        let valY = 0;
        let valX_ones = 0, valX_tens = 0;
        let valY_ones = 0, valY_tens = 0;
        let expectedAnswer = 0;
        let currentInput = "";
        let isAnimating = false;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(frequency, type, duration) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = type;
            oscillator.frequency.value = frequency;
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
        }

        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

        function init() {
            for (let i = 1; i <= 9; i++) createBtn(i);
            createBtn(0);
            createBtn('クリア');
        }

        function createBtn(val) {
            const btn = document.createElement('button');
            btn.className = 'num-btn';
            btn.textContent = val;
            if (val === 'クリア') {
                btn.style.fontSize = '20px';
                btn.style.backgroundColor = '#6c757d';
                btn.style.boxShadow = '0 4px 0 #495057';
                btn.onclick = () => { if(!isAnimating) resetInput(); };
            } else {
                btn.onclick = () => handleInput(val, btn);
            }
            numpad.appendChild(btn);
        }

        function createCoin(val) {
            const div = document.createElement('div');
            div.className = val === 1 ? 'coin coin-1' : 'coin coin-10';
            div.textContent = val;
            return div;
        }

        function showLevelSelect() {
            levelSelect.style.display = 'flex';
            gameArea.style.visibility = 'hidden';
            numpad.style.visibility = 'hidden';
            backBtn.style.visibility = 'hidden';
            resetInput();
        }

        function startGame(level) {
            currentLevel = level;
            levelSelect.style.display = 'none';
            gameArea.style.visibility = 'visible';
            numpad.style.visibility = 'visible';
            backBtn.style.visibility = 'visible';
            
            // レベル1の場合は、10のホバリングエリアを隠す
            tensHoverArea.style.display = currentLevel === 1 ? 'none' : 'flex';
            
            startNextRound();
        }

        function startNextRound() {
            isAnimating = false;
            resetInput();
            onesTube.innerHTML = "";
            tensTube.innerHTML = "";
            onesHoverArea.innerHTML = "";
            tensHoverArea.innerHTML = "";
            overlay.style.opacity = "0";

            if (currentLevel === 1) {
                // レベル1：1桁＋1桁（必ず繰り上がる）
                valX_ones = Math.floor(Math.random() * 4) + 6; // 6~9
                const minY = 11 - valX_ones;
                valY_ones = Math.floor(Math.random() * (10 - minY)) + minY;
                valX_tens = 0; valY_tens = 0;
            } else {
                // レベル2：2桁＋2桁（1の位は必ず繰り上がり、和が99以下になるように制御）
                valX_ones = Math.floor(Math.random() * 4) + 6; 
                const minY = 11 - valX_ones;
                valY_ones = Math.floor(Math.random() * (10 - minY)) + minY;
                
                // 10の位の合計が8以下になるようにする（繰り上がりの1を足して9以下に収めるため）
                valX_tens = Math.floor(Math.random() * 4) + 1; // 1~4
                valY_tens = Math.floor(Math.random() * (8 - valX_tens)) + 1; 
            }

            valX = valX_tens * 10 + valX_ones;
            valY = valY_tens * 10 + valY_ones;
            expectedAnswer = valX + valY;

            eqX.textContent = valX;
            eqY.textContent = valY;

            // Xのコインを各部屋に配置
            for(let i=0; i<valX_tens; i++) tensTube.appendChild(createCoin(10));
            for(let i=0; i<valX_ones; i++) onesTube.appendChild(createCoin(1));

            // Yのコインを各ホバリングエリアに配置
            for(let i=0; i<valY_tens; i++) tensHoverArea.appendChild(createCoin(10));
            for(let i=0; i<valY_ones; i++) onesHoverArea.appendChild(createCoin(1));
        }

        function resetInput() {
            currentInput = "";
            eqAns.textContent = "";
            cursor.style.display = "inline-block";
        }

        function handleInput(num, btnElement) {
            if (isAnimating || currentInput.length >= expectedAnswer.toString().length) return;
            
            playBeep(800, 'sine', 0.1);
            currentInput += num.toString();
            eqAns.textContent = currentInput;

            if (currentInput.length === expectedAnswer.toString().length) {
                cursor.style.display = "none";
                if (parseInt(currentInput) === expectedAnswer) {
                    processCorrectAnswer();
                } else {
                    processWrongAnswer(btnElement);
                }
            }
        }

        function processWrongAnswer(btnElement) {
            playBeep(150, 'sawtooth', 0.3); 
            btnElement.classList.add('shake');
            setTimeout(() => {
                btnElement.classList.remove('shake');
                resetInput();
            }, 400);
        }

        async function processCorrectAnswer() {
            isAnimating = true; 
            playBeep(1200, 'sine', 0.1); 
            setTimeout(() => playBeep(1600, 'sine', 0.2), 100); 

            const neededFor10 = 10 - valX_ones;
            const remainingOnes = valY_ones - neededFor10;

            // 【ステップ1】1の位：10の補数分だけ移動
            for(let i=0; i<neededFor10; i++) {
                const coin = onesHoverArea.lastElementChild;
                if(coin) {
                    onesTube.appendChild(coin);
                    coin.style.animation = 'none';
                    void coin.offsetWidth; 
                    coin.style.animation = 'jumpIn 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards';
                    await sleep(300); 
                }
            }

            await sleep(200);

            // 【ステップ2】1の位：10個が合体して、10の位へ繰り上がり移動
            const onesCoins = Array.from(onesTube.querySelectorAll('.coin'));
            playBeep(2000, 'square', 0.4); 
            
            onesCoins.forEach(c => {
                c.style.animation = 'none';
                void c.offsetWidth;
                c.classList.add('glow-merge');
            });
            
            await sleep(700); 
            onesTube.innerHTML = ""; 

            // 10円玉を10の部屋に落とす
            const tenCoin = document.createElement('div');
            tenCoin.className = 'coin coin-10';
            tenCoin.textContent = '10';
            tenCoin.style.animation = 'dropTen 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards';
            tensTube.appendChild(tenCoin);
            
            await sleep(500); 

            // 【ステップ3】1の位：残りのコインを移動
            for(let i=0; i<remainingOnes; i++) {
                const coin = onesHoverArea.lastElementChild;
                if(coin) {
                    onesTube.appendChild(coin);
                    coin.style.animation = 'none';
                    void coin.offsetWidth;
                    coin.style.animation = 'jumpIn 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards';
                    await sleep(300);
                }
            }
            
            await sleep(300);

            // 【ステップ4】10の位：ホバリングしている10のコインを移動（レベル2のみ）
            if (currentLevel === 2) {
                const tenHoverCoins = Array.from(tensHoverArea.children).reverse();
                for(let i=0; i<tenHoverCoins.length; i++) {
                    const coin = tenHoverCoins[i];
                    tensTube.appendChild(coin);
                    coin.style.animation = 'none';
                    void coin.offsetWidth;
                    coin.style.animation = 'jumpIn 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards';
                    await sleep(300);
                }
            }

            // フィナーレ演出
            overlay.style.opacity = "1";
            playBeep(523.25, 'sine', 0.1); 
            setTimeout(() => playBeep(659.25, 'sine', 0.1), 100); 
            setTimeout(() => playBeep(783.99, 'sine', 0.3), 200); 

            await sleep(2000); 
            startNextRound(); 
        }

        window.onload = init;
    </script>
</body>
</html>
